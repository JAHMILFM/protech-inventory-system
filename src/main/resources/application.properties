spring.application.name=Ferreteria Pro-Tech

# ═══════════════════════════════════════════════════
# DATABASE CONFIGURATION - MySQL 8
# ═══════════════════════════════════════════════════
spring.datasource.url=jdbc:mysql://localhost:3306/ferreteria_protech?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=071203
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ═══════════════════════════════════════════════════
# JPA / HIBERNATE
# ═══════════════════════════════════════════════════
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ═══════════════════════════════════════════════════
# THYMELEAF
# ═══════════════════════════════════════════════════
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ═══════════════════════════════════════════════════
# SERVER
# ═══════════════════════════════════════════════════
server.port=8080

# ═══════════════════════════════════════════════════
# JACKSON (JSON serialization)
# ═══════════════════════════════════════════════════
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Lima
