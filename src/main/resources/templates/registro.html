<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Pro-Tech Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tienda.css}">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-page);
            padding: 2rem;
        }
        .auth-card {
            background: white;
            padding: 3rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 500px;
        }
        .auth-card h1 {
            color: var(--brand-dark);
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .auth-card p.subtitle {
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-main);
            font-size: 0.9rem;
        }
        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }
        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
        }
        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 1rem;
        }
        .btn-submit:hover {
            background: var(--accent-hover);
        }
        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .auth-footer a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }
        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <h1>Crea tu cuenta</h1>
            <p class="subtitle">Únete a Pro-Tech Store y compra más rápido</p>

            <form id="registroForm">
                <div class="form-group">
                    <label for="nombreCompleto">Nombre Completo</label>
                    <input type="text" id="nombreCompleto" class="form-control" required placeholder="Ej. Juan Pérez">
                </div>

                <div class="form-group">
                    <label for="username">Nombre de Usuario</label>
                    <input type="text" id="username" class="form-control" required placeholder="Elige un usuario único">
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" required placeholder="tu@correo.com">
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono (opcional)</label>
                    <input type="text" id="telefono" class="form-control" placeholder="Ej. 999 888 777">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" required placeholder="Mínimo 6 caracteres">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" class="form-control" required placeholder="Repite tu contraseña">
                    <div id="passwordError" class="error-msg">Las contraseñas no coinciden.</div>
                </div>

                <div id="generalError" class="error-msg" style="text-align:center; font-size:1rem; margin-bottom:1rem;"></div>

                <button type="submit" class="btn-submit" id="submitBtn">Crear Cuenta</button>
            </form>

            <div class="auth-footer">
                ¿Ya tienes una cuenta? <a th:href="@{/login}">Inicia sesión aquí</a>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast" style="bottom: 20px; right: 20px;">
        <span id="toastIcon">✅</span>
        <span id="toastMessage"></span>
    </div>

    <script>
        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const pwd = document.getElementById('password').value;
            const pwdConf = document.getElementById('confirmPassword').value;
            const pwdErr = document.getElementById('passwordError');
            const genErr = document.getElementById('generalError');

            if (pwd !== pwdConf) {
                pwdErr.style.display = 'block';
                return;
            } else {
                pwdErr.style.display = 'none';
            }

            genErr.style.display = 'none';
            btn.disabled = true;
            btn.innerText = 'Registrando...';

            const payload = {
                nombreCompleto: document.getElementById('nombreCompleto').value,
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                telefono: document.getElementById('telefono').value,
                password: pwd
            };

            try {
                const res = await fetch('/api/auth/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    const toast = document.getElementById('toast');
                    document.getElementById('toastMessage').innerText = '¡Registro exitoso! Redirigiendo a Login...';
                    toast.classList.add('show');
                    setTimeout(() => window.location.href = '/login', 2000);
                } else {
                    genErr.innerText = data.error || 'Ocurrió un error';
                    genErr.style.display = 'block';
                }
            } catch(e) {
                genErr.innerText = 'Error de conexión';
                genErr.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Crear Cuenta';
            }
        });
    </script>
</body>
</html>
