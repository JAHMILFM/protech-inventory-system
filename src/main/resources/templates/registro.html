<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Pro-Tech Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }
        .auth-card {
            width: 100%;
            max-width: 500px;
            animation: slideUp 0.5s ease-out forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .auth-card h1 {
            color: var(--text-main);
            margin-bottom: 0.5rem;
            text-align: center;
            font-size: 1.8rem;
        }
        .auth-card p.subtitle {
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .auth-footer a {
            color: var(--accent);
            font-weight: 600;
        }
        .auth-footer a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }
        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
            padding: 8px;
            background: var(--danger-bg);
            border-radius: var(--radius-sm);
        }
        
        .login-theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        .login-theme-toggle:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-md);
        }
    </style>
</head>
<body>
    <button class="login-theme-toggle" id="themeToggleBtn" aria-label="Toggle Theme">
        <span id="themeIcon">☀️</span>
    </button>

    <div class="auth-container">
        <div class="card auth-card">
            <h1>Crea tu cuenta</h1>
            <p class="subtitle">Únete a Pro-Tech Store y compra más rápido</p>

            <form id="registroForm">
                <div class="form-group">
                    <label class="form-label" for="nombreCompleto">Nombre Completo</label>
                    <input type="text" id="nombreCompleto" class="form-control" required placeholder="Ej. Juan Pérez">
                </div>

                <div class="form-group">
                    <label class="form-label" for="username">Nombre de Usuario</label>
                    <input type="text" id="username" class="form-control" required placeholder="Elige un usuario único">
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" required placeholder="tu@correo.com">
                </div>

                <div class="form-group">
                    <label class="form-label" for="telefono">Teléfono (opcional)</label>
                    <input type="text" id="telefono" class="form-control" placeholder="Ej. 999 888 777">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" required placeholder="Mínimo 6 caracteres">
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" class="form-control" required placeholder="Repite tu contraseña">
                    <div id="passwordError" class="error-msg">⚠️ Las contraseñas no coinciden.</div>
                </div>

                <div id="generalError" class="error-msg" style="text-align:center; font-size:0.9rem; margin-bottom:1rem;"></div>

                <button type="submit" class="btn-primary" id="submitBtn" style="width:100%; padding: 14px; text-transform: uppercase; font-size: 1rem;">Crear Cuenta</button>
            </form>

            <div class="auth-footer">
                ¿Ya tienes una cuenta? <a th:href="@{/login}">Inicia sesión aquí</a>
            </div>
        </div>
    </div>

    <script th:src="@{/js/theme.js}"></script>
    <script>
        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const pwd = document.getElementById('password').value;
            const pwdConf = document.getElementById('confirmPassword').value;
            const pwdErr = document.getElementById('passwordError');
            const genErr = document.getElementById('generalError');

            if (pwd !== pwdConf) {
                pwdErr.style.display = 'block';
                return;
            } else {
                pwdErr.style.display = 'none';
            }

            genErr.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<span class="loader-spinner" style="width:16px;height:16px;border-width:2px;border-top-color:#0D1B2A;"></span> Registrando...';
            btn.style.opacity = '0.8';

            const payload = {
                nombreCompleto: document.getElementById('nombreCompleto').value,
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                telefono: document.getElementById('telefono').value,
                password: pwd
            };

            try {
                const res = await fetch('/api/auth/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    showToast('¡Registro exitoso! Redirigiendo...', 'success');
                    setTimeout(() => window.location.href = '/login', 2000);
                } else {
                    genErr.innerText = '⚠️ ' + (data.error || 'Ocurrió un error en el registro');
                    genErr.style.display = 'block';
                    btn.disabled = false;
                    btn.innerText = 'Crear Cuenta';
                    btn.style.opacity = '1';
                }
            } catch(e) {
                genErr.innerText = '⚠️ Error de conexión con el servidor.';
                genErr.style.display = 'block';
                btn.disabled = false;
                btn.innerText = 'Crear Cuenta';
                btn.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
