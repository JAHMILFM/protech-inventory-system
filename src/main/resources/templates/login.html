<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-Tech | Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background */
        .bg-animation {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            width: 600px; height: 600px;
            background: radial-gradient(circle, var(--accent-light), transparent 70%);
            top: -200px; right: -200px;
            border-radius: 50%;
            animation: float1 8s ease-in-out infinite;
        }

        .bg-animation::after {
            content: '';
            position: absolute;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(27,38,59,0.2), transparent 70%);
            bottom: -100px; left: -100px;
            border-radius: 50%;
            animation: float2 10s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-50px, 50px) scale(1.1); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -40px) scale(1.05); }
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 48px 40px;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-logo .logo-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px var(--accent-light);
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 8px 32px var(--accent-light); }
            50% { box-shadow: 0 8px 48px var(--accent-light); }
        }

        .login-logo h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .login-logo h1 span {
            color: var(--accent);
        }

        .login-logo p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: #0D1B2A;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 700;
            font-family: var(--font-family);
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-light);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .alert-error {
            background: var(--danger-bg);
            border: 1px solid rgba(230, 57, 70, 0.3);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
            animation: shake 0.4s ease;
        }

        .alert-success {
            background: var(--success-bg);
            border: 1px solid rgba(46, 196, 182, 0.3);
            color: var(--success);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: var(--text-muted);
            font-size: 12px;
        }

        /* Toggle Theme specific to login top right */
        .login-theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        .login-theme-toggle:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-md);
        }
    </style>
</head>
<body>
    <button class="login-theme-toggle" id="themeToggleBtn" aria-label="Toggle Theme">
        <span id="themeIcon">☀️</span>
    </button>
    <div class="bg-animation"></div>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">🔩</div>
                <h1>Pro-<span>Tech</span></h1>
                <p>Sistema de Inventario Industrial</p>
            </div>

            <div th:if="${param.error}" class="alert-error">
                ⚠️ Usuario o contraseña incorrectos
            </div>

            <div th:if="${param.logout}" class="alert-success">
                ✅ Sesión cerrada correctamente
            </div>

            <form th:action="@{/login}" method="post" id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Usuario</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Ingresa tu usuario" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                </div>
                <button type="submit" class="btn-login" id="btn-login">
                    Iniciar Sesión
                </button>
            </form>

            <div class="login-footer">
                <p style="margin-bottom: 10px; font-size: 13px;">¿No tienes una cuenta? <a th:href="@{/registro}" style="color: var(--accent); text-decoration: none; font-weight: 600;">Regístrate aquí</a></p>
                <p>© 2026 Ferretería Pro-Tech v1.0</p>
            </div>
        </div>
    </div>
    
    <script th:src="@{/js/theme.js}"></script>
    <script>
        // Simple loading feedback on submit
        document.getElementById('loginForm').addEventListener('submit', function() {
            const btn = document.getElementById('btn-login');
            btn.innerHTML = '<span class="loader-spinner" style="width:16px;height:16px;border-width:2px;vertical-align:middle;margin-right:8px;border-top-color:#0D1B2A;"></span> Iniciando...';
            btn.style.opacity = '0.8';
        });
    </script>
</body>
</html>
