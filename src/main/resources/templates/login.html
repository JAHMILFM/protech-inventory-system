<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-Tech | Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-main: #0D1B2A;
            --sidebar: #1B263B;
            --accent: #CCFF00;
            --accent-hover: #B8E600;
            --text-light: #E0E1DD;
            --text-muted: #778DA9;
            --card-bg: #1B263B;
            --danger: #E63946;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated background */
        .bg-animation {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(204,255,0,0.08), transparent 70%);
            top: -200px; right: -200px;
            border-radius: 50%;
            animation: float1 8s ease-in-out infinite;
        }

        .bg-animation::after {
            content: '';
            position: absolute;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(27,38,59,0.6), transparent 70%);
            bottom: -100px; left: -100px;
            border-radius: 50%;
            animation: float2 10s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-50px, 50px) scale(1.1); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -40px) scale(1.05); }
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: rgba(27, 38, 59, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(204, 255, 0, 0.1);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-logo .logo-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--accent), #a8d600);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(204,255,0,0.2);
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 8px 32px rgba(204,255,0,0.2); }
            50% { box-shadow: 0 8px 48px rgba(204,255,0,0.35); }
        }

        .login-logo h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-light);
            letter-spacing: -0.5px;
        }

        .login-logo h1 span {
            color: var(--accent);
        }

        .login-logo p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(13, 27, 42, 0.6);
            border: 1px solid rgba(119, 141, 169, 0.2);
            border-radius: 12px;
            color: var(--text-light);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(204,255,0,0.1);
            background: rgba(13, 27, 42, 0.8);
        }

        .form-group input::placeholder {
            color: rgba(119, 141, 169, 0.5);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: var(--bg-main);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
        }

        .btn-login:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(204,255,0,0.25);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .alert-error {
            background: rgba(230, 57, 70, 0.15);
            border: 1px solid rgba(230, 57, 70, 0.3);
            color: #ff6b6b;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
            animation: shake 0.4s ease;
        }

        .alert-success {
            background: rgba(46, 196, 182, 0.15);
            border: 1px solid rgba(46, 196, 182, 0.3);
            color: #2ec4b6;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: var(--text-muted);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">🔩</div>
                <h1>Pro-<span>Tech</span></h1>
                <p>Sistema de Inventario Industrial</p>
            </div>

            <div th:if="${param.error}" class="alert-error">
                ⚠️ Usuario o contraseña incorrectos
            </div>

            <div th:if="${param.logout}" class="alert-success">
                ✅ Sesión cerrada correctamente
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                </div>
                <button type="submit" class="btn-login" id="btn-login">
                    Iniciar Sesión
                </button>
            </form>

            <div class="login-footer">
                <p>© 2026 Ferretería Pro-Tech v1.0</p>
            </div>
        </div>
    </div>
</body>
</html>
